# ====== Настройки сканера funding-арбитража ======
# Сканер ТОЛЬКО читает публичные данные. API-ключи не нужны, сделок не делает.

capital_usd: 500          # ваш капитал
hold_days: 7              # сколько дней планируете держать позицию (комиссии делятся на этот срок)
perp_leverage: 2          # плечо на фьючерсной ноге (1–3; больше = выше риск ликвидации)

min_net_apr: 15           # показывать только связки с чистой годовой доходностью >= N %
min_perp_volume_usd: 5000000   # минимальный суточный оборот фьючерса, $
min_spot_volume_usd: 1000000   # минимальный суточный оборот спота, $ (для спот-фьючерс)
max_price_diff_pct: 2.0   # если цены одной монеты на биржах расходятся сильнее — скорее всего это разные токены, пропускаем

history_check_top: 15     # для скольких лучших кандидатов загружать историю ставок
history_periods: 21       # сколько последних выплат брать (21 × 8ч = 7 дней)

scan_interval_minutes: 10 # пауза между сканами в режиме --loop
top_n: 15                 # сколько строк показывать в каждой таблице

# Комиссии taker в долях (0.001 = 0.1%). Это базовый уровень (VIP0) —
# ПРОВЕРЬТЕ в своём аккаунте: скидки за BNB/OKB/объём сильно меняют результат.
# enabled — наблюдать за биржей (его читает старый сканер; для движка это watch).
# trade   — разрешено торговать на бирже (только у bybit, okx, hyperliquid).
exchanges:
  bybit:
    enabled: true
    trade: true
    spot_taker: 0.0010
    perp_taker: 0.00055
  okx:
    enabled: true
    trade: true
    spot_taker: 0.0010
    perp_taker: 0.0005
  hyperliquid:             # рынки к USDC (USDC считаем равным USD)
    enabled: true
    trade: true
    spot_taker: 0.0007
    perp_taker: 0.00045
  binance:
    enabled: true
    trade: false
    spot_taker: 0.0010
    perp_taker: 0.0005
  bitget:
    enabled: true
    trade: false
    spot_taker: 0.0010
    perp_taker: 0.0006
  gate:
    enabled: true
    trade: false
    spot_taker: 0.0020
    perp_taker: 0.0005
  whitebit:
    enabled: true
    trade: false
    spot_taker: 0.0010
    perp_taker: 0.00055
  mexc:
    enabled: true
    trade: false
    spot_taker: 0.0005
    perp_taker: 0.0002
  # Coinbase не отдаёт текущие ставки финансирования через API (ccxt),
  # а бессрочные фьючерсы Coinbase International доступны не во всех странах.
  # Поэтому в сканер funding он не включён.
  coinbase:
    enabled: false

# ====== Движок (engine/) ======
engine:
  mode: semi              # semi — каждую сделку подтверждаете вы; auto — бот открывает сам
  virtual: true           # true — бумажная торговля, реальных ордеров нет
  aggressive_apr: 80      # порог «агрессивного» профиля, % годовых
  db_path: data/shio.db
  collect_interval_s: 60  # как часто собирать данные
  guard_interval_s: 30    # как часто проверять открытые позиции
  paper_balances:         # стартовые виртуальные балансы; сумма должна равняться capital_usd
    bybit: 170
    okx: 170
    hyperliquid: 160
  limits:
    max_leverage: 3          # плечо, 1–10
    max_pair_share: 0.5      # доля капитала на одну связку
    max_positions: 3         # связок одновременно
    aggressive_share: 0.3    # доля капитала под агрессивный профиль
    min_auto_apr: 20         # мин. доходность для автомата, % годовых
    daily_loss_pause: 0.05   # дневной убыток, после которого пауза
    warn_buffer: 0.40        # запас до ликвидации: предупреждение
    act_buffer: 0.20         # запас до ликвидации: довнести маржу или закрыть
    max_drift: 0.01          # допустимый перекос номиналов ног
    proposal_ttl_s: 900      # срок действия предложения
    max_slippage: 0.001      # допустимое проскальзывание
    leg_retries: 3           # попыток открыть вторую ногу

# ====== Telegram-бот (токен — только в переменной окружения SHIO_TELEGRAM_TOKEN) ======
telegram:
  enabled: false          # true — слать уведомления и принимать команды в Telegram
  # chat_id: ваш числовой id чата. Как получить: напишите боту @userinfobot (или любому боту
  # «get my id») и скопируйте число; для группы id отрицательный. Нужен, если enabled: true.
  daily_summary_hour_utc: 18   # час (UTC) ежедневной сводки, 0–23
  dedupe_s: 600           # одинаковые тревоги в Telegram — не чаще раза в N секунд (≥ 60)

# ====== Резервные копии базы (ключ шифрования — в переменной окружения SHIO_BACKUP_KEY) ======
backup:
  enabled: true
  hour_utc: 3             # час (UTC), когда присылать копию файлом, 0–23

# ====== Оповещения о Launchpool ======
launchpool:
  enabled: true
  interval_s: 1800        # как часто проверять, не менее 60 секунд
  exchanges: [bybit, okx]
